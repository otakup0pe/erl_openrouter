name: Test

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['27']
    container:
      image: erlang:${{ matrix.otp }}-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: apt-get update && apt-get install -y make git curl

      - name: Install rebar3
        run: |
          curl -fsSL https://github.com/erlang/rebar3/releases/latest/download/rebar3 -o /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Run tests
        run: make test-local

  maybe_bump:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/mainline'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for version bump hint
        id: bump_check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi
          MESSAGES=$(git log --format=%B "$RANGE")
          if echo "$MESSAGES" | grep -qiE '#major|bump:major'; then
            echo "part=major" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGES" | grep -qiE '#minor|bump:minor'; then
            echo "part=minor" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGES" | grep -qiE '#patch|bump:patch'; then
            echo "part=patch" >> "$GITHUB_OUTPUT"
          else
            echo "part=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump_check.outputs.part != ''
        run: |
          pip install avakas
          avakas bump . ${{ steps.bump_check.outputs.part }} --flavor git-native
